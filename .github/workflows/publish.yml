name: publish

on:
  schedule:
    - cron: "0 9 * * *"    # 12:00 по Москве, каждый день
    - cron: "0 16 * * *"   # 19:00 по Москве, каждый день
  workflow_dispatch:
    inputs:
      post:
        description: "Папка поста (пусто = следующий в очереди)"
        required: false
      telegram:
        description: "Отправлять задачу в Telegram (false = только Instagram)"
        required: false
        default: "true"

permissions:
  contents: write

concurrency: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish next post
        run: python3 publish.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: "17841466669220590"
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          IG_PAUSE: "1"   # карусели в Instagram на паузе с 05.11 — переходим на Reels
          # с 14.11.2026: Reels — 2 в день (12:00 и 19:00 МСК), плюс при ручном запуске
          REEL_SLOT: "true"
          TG_TOKEN: ${{ github.event.inputs.telegram != 'false' && secrets.TG_TOKEN || '' }}
          TG_CHAT: "@sqlsenior"
          POST: ${{ github.event.inputs.post }}
      - name: Save progress
        if: always()
        run: |
          git config user.name "seniorsql-bot"
          git config user.email "seniorsql-bot@users.noreply.github.com"
          touch published.txt telegram_sent.txt reels_published.txt telegram_reels_sent.txt
          git add published.txt telegram_sent.txt reels_published.txt telegram_reels_sent.txt
          git commit -m "published" || exit 0
          git pull --rebase
          git push

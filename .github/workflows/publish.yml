name: publish

on:
  schedule:
    - cron: "0 16 * * 1-5"   # 19:00 по Москве, пн–пт
  workflow_dispatch:
    inputs:
      post:
        description: "Папка поста (пусто = следующий в очереди)"
        required: false

permissions:
  contents: write

concurrency: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish next post
        run: python3 publish.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: "17841466669220590"
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: "@sqlsenior"
          POST: ${{ github.event.inputs.post }}
      - name: Save progress
        run: |
          git config user.name "seniorsql-bot"
          git config user.email "seniorsql-bot@users.noreply.github.com"
          git add published.txt
          git commit -m "published" || exit 0
          git push

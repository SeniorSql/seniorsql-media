name: tg-once
# Разовые посты в Telegram: загрузи файл в telegram/once/ — робот отправит его один раз
# (отправленные записываются в telegram_once_sent.txt). Формат файла — как у telegram/welcome.json.
on:
  push:
    paths:
      - "telegram/once/**"

permissions:
  contents: write

concurrency: publish

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send new one-off posts
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: "@sqlsenior"
        run: |
          touch telegram_once_sent.txt
          for f in $(ls telegram/once/*.json 2>/dev/null | sort); do
            if ! grep -qx "$f" telegram_once_sent.txt; then
              python3 telegram.py "$f" && echo "$f" >> telegram_once_sent.txt
            fi
          done
      - name: Save progress
        if: always()
        run: |
          git config user.name "seniorsql-bot"
          git config user.email "seniorsql-bot@users.noreply.github.com"
          git add telegram_once_sent.txt
          git commit -m "telegram once" || exit 0
          git pull --rebase
          git push
